# =============================================================================
# DOCKER COMPOSE — Portfolio Site
# Runs Nginx to serve the static site.
# The site/ directory is bind-mounted read-only for Nginx.
#
# Usage:
#   docker compose up -d --build   # Build and start all containers
#   docker compose down            # Stop and remove all containers
#   docker compose restart         # Restart after config changes
# =============================================================================

#version: "3.9"
services:
  # --- Static Site Server ---
  web:
    image: nginx:alpine           # Lightweight Nginx image
    container_name: portfolio-web
    ports:
      - "8080:80"                 # Map host port 8080 to container port 80
                                  # (separate from other services like Juice Shop on :80)
    volumes:
      # Mount the site files into Nginx's document root (read-only)
      - ./site:/usr/share/nginx/html:ro
      # Mount the custom Nginx config (read-only)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped       # Auto-restart on crash or reboot (unless manually stopped)

  # --- Threat-Intel Theme Proxy ---
  # Forwards to the Azure-hosted app and injects the portfolio theme into its pages.
  # Bound to localhost; the public route is threatintel.geraldjonesii.dev via the tunnel.
  threatintel:
    image: nginx:alpine
    container_name: portfolio-threatintel
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      # Directories rather than single files, so edits are seen without recreating the container
      - ./threatintel/conf.d:/etc/nginx/conf.d:ro
      - ./threatintel/theme:/usr/share/nginx/html/_theme:ro
    restart: unless-stopped
