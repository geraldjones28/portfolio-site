# =============================================================================
# NGINX CONFIGURATION — Threat-Intel Digest theme proxy
# The app runs on Azure. This server forwards requests to it and injects the
# portfolio's terminal theme into each HTML page on the way back.
# The app itself is unchanged, and its azurewebsites.net URL stays unstyled.
# =============================================================================

server {
  listen 80 default_server;
  server_name _;  # Only reachable through the Cloudflare Tunnel (bound to localhost)

  # --- Security Headers ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'" always;

  # --- Compression ---
  gzip on; gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # --- Theme Assets ---
  location ^~ /_theme/ { root /usr/share/nginx/html; }

  # --- Azure App Proxy ---
  location / {
    # Resolve at request time, so a DNS failure can't stop Nginx from starting
    # and a changed Azure IP doesn't require a restart. 127.0.0.11 is Docker's DNS.
    resolver 127.0.0.11 valid=60s;
    set $azure_app gj-threatintel-tryit.azurewebsites.net;
    proxy_pass https://$azure_app;

    # Azure picks the app from the Host header and checks it against its certificate
    proxy_set_header Host $azure_app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name $azure_app;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;  # Default of 1 fails on Azure's intermediate certificates
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Allow time for the app to wake from idle (Cloudflare gives up at ~100s)
    proxy_read_timeout 100s;

    # Keep cookies and redirects on the public hostname
    proxy_cookie_domain $azure_app threatintel.geraldjonesii.dev;
    proxy_redirect https://gj-threatintel-tryit.azurewebsites.net/ /;

    # --- Theme Injection ---
    # sub_filter can only edit uncompressed responses. Only </head> is needed for
    # the theme; theme.js builds the rest. If the app's wording changes, the
    # replacements below stop matching and its original text shows instead.
    # Cloudflare caches static files for 4 hours: bump ?v= after editing theme files.
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/_theme/favicon.svg"><link rel="stylesheet" href="/_theme/theme.css?v=2"><script src="/_theme/theme.js?v=2"></script></head>';
    sub_filter '<h1>Threat-Intel Digest - TryIt page</h1>' '<h1>Threat-Intel Digest</h1>';
    sub_filter 'Each section below tests one service operation. Enter the input, press Invoke, and the response appears under Result.' 'Three live threat-intelligence web services. Enter an input and press Invoke to run one.';
    sub_filter '1. Top10ContentWords (required service 5, WSDL/SOAP)' '1. Top10ContentWords <span class="tag">WSDL/SOAP</span>';
    sub_filter '2. NewsFocus (required service 13, RESTful)' '2. NewsFocus <span class="tag">REST</span>';
    sub_filter '3. KevLookup (elective service, RESTful)' '3. KevLookup <span class="tag">REST</span>';
  }
}
